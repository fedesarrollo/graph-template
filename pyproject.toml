[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fedesarrollo-estilo-graficas"
version = "0.5.0"
description = "Formato estándar de gráficas para matplotlib con la paleta institucional"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.6"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["fedesarrollo_estilo_graficas"]

[tool.setuptools.package-data]
fedesarrollo_estilo_graficas = ["fuentes/*.ttf", "fuentes/OFL.txt"]
